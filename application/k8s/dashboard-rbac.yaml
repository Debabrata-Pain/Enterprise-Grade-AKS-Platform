apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: enterprise-flask-dashboard-reader

rules:

  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - namespaces
    verbs:
      - get
      - list

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list

  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: enterprise-flask-dashboard-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: enterprise-flask-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: enterprise-flask-sa
    namespace: default