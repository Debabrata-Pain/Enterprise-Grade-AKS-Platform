apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: enterprise-flask-dashboard-reader

rules:

  # Nodes
  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - get
      - list

  # Pods and Services
  - apiGroups: [""]
    resources:
      - pods
      - services
    verbs:
      - get
      - list

  # Deployments
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list

  # Ingress
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list


---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: enterprise-flask-dashboard-reader

roleRef:

  apiGroup: rbac.authorization.k8s.io

  kind: ClusterRole

  name: enterprise-flask-dashboard-reader

subjects:

  - kind: ServiceAccount

    name: enterprise-flask-sa

    namespace: default