apiVersion: apps/v1
kind: Deployment

metadata:
  name: enterprise-flask
  labels:
    app: enterprise-flask

spec:
  replicas: 2
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: enterprise-flask

  template:
    metadata:
      labels:
        app: enterprise-flask
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: enterprise-flask-sa

      containers:
        - name: enterprise-flask
          image: prodaksacrdeb2026.azurecr.io/enterprise-flask:IMAGE_TAG
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: ENVIRONMENT
              value: "Production"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15

      