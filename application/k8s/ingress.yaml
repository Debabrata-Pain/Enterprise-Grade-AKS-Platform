apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-flask
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: webapprouting.kubernetes.azure.com

  tls:
    - hosts:
        - debabrata-pain.hs.vc
      secretName: enterprise-flask-tls

  rules:
    - host: debabrata-pain.hs.vc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: enterprise-flask
                port:
                  number: 80