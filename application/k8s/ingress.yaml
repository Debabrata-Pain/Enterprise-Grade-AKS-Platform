apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: enterprise-flask

spec:
  ingressClassName: webapprouting.kubernetes.azure.com

  rules:
  - host : debabrata-pain.hs.vc
    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: enterprise-flask
            port:
              number: 80