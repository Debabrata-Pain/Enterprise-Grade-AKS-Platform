parameters:
- name: azureSubscription
  type: string

- name: resourceGroup
  type: string

- name: aksCluster
  type: string

steps:

- task: AzureCLI@2
  displayName: Deploy to AKS

  inputs:
    azureSubscription: ${{ parameters.azureSubscription }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
        set -e

        echo "Getting AKS credentials..."
        az aks get-credentials \
          --resource-group "${{ parameters.resourceGroup }}" \
          --name "${{ parameters.aksCluster }}" \
          --overwrite-existing

        echo "AKS connection:"
        kubectl cluster-info

        echo "Preparing manifests..."
        cd "$(Pipeline.Workspace)/manifests"

        sed -i "s/IMAGE_TAG/$(Build.BuildId)/g" deployment.yaml

        echo "Applying Kubernetes manifests..."
        kubectl apply -f .

        echo "Waiting for deployment rollout..."
        kubectl rollout status deployment/enterprise-flask --timeout=180s

        echo "Deployment successful."
        kubectl get deployment enterprise-flask
        kubectl get pods -l app=enterprise-flask

    