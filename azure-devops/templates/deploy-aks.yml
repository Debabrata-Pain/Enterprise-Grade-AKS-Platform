parameters:
- name: azureSubscription
  type: string

- name: resourceGroup
  type: string

- name: aksCluster
  type: string

steps:

- task: AzureCLI@2
  displayName: Deploy to AKS

  inputs:
    azureSubscription: ${{ parameters.azureSubscription }}
    scriptType: bash
    scriptLocation: inlineScript

    inlineScript: |

      az aks get-credentials \
      --resource-group ${{ parameters.resourceGroup }} \
      --name ${{ parameters.aksCluster }} \
      --overwrite-existing

      cd $(Pipeline.Workspace)/manifests

      sed -i "s/IMAGE_TAG/$(Build.BuildId)/g" deployment.yaml

      kubectl apply -f .

      kubectl rollout status deployment/enterprise-flask