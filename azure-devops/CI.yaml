trigger:
  branches:
    include:
      - main

pool:
  name: Enterprise-AKS-Agents

variables:
- group: Enterprise-AKS-Variables

stages:

# ============================================================
# STAGE 1 - PRODUCTION APPROVAL
# ============================================================

- stage: ProductionApproval
  displayName: Production Approval
  dependsOn: []
  condition: succeeded()

  jobs:

  - deployment: ProductionApproval
    displayName: Waiting for Production Approval

    environment: 'Production'

    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              echo "Production approval granted."
              echo "Pipeline will now proceed to Build."
            displayName: Approval Granted


# ============================================================
# STAGE 2 - CHECKOV SECURITY SCAN
# ============================================================

- stage: Checkov
  displayName: Checkov Security Scan

  dependsOn: ProductionApproval

  condition: succeeded()

  jobs:

  - job: CheckovScan
    displayName: Scan Infrastructure and Kubernetes

    steps:

    - checkout: self

    - script: |
        python3 -m pip install --upgrade pip
        python3 -m pip install checkov
      displayName: Install Checkov

    - script: |
        checkov \
          --directory terraform \
          --framework terraform \
          --output cli
      displayName: Checkov Terraform Scan

    - script: |
        checkov \
          --directory application/k8s \
          --framework kubernetes \
          --output cli
      displayName: Checkov Kubernetes Scan


# ============================================================
# STAGE 3 - BUILD
# ============================================================

- stage: Build
  displayName: Build Docker Image

  dependsOn: ProductionApproval
  condition: succeeded()

  jobs:

  - job: DockerBuild
    displayName: Build & Push Image

    steps:

    - checkout: self

    - template: templates/docker-build-image.yml

      parameters:
        acrServiceConnection: 'ACR-ServiceConnection'
        imageRepository: 'enterprise-flask'
        dockerfile: 'application/Dockerfile'
        buildContext: 'application'

    - task: CopyFiles@2
      displayName: Copy Kubernetes Manifests

      inputs:
        SourceFolder: application/k8s
        Contents: '**'
        TargetFolder: $(Build.ArtifactStagingDirectory)

    - task: PublishBuildArtifacts@1
      displayName: Publish K8s Manifests

      inputs:
        PathtoPublish: $(Build.ArtifactStagingDirectory)
        ArtifactName: manifests


# ============================================================
# STAGE 4 - DEPLOY
# ============================================================

- stage: Deploy
  displayName: Deploy to AKS

  dependsOn: Build
  condition: succeeded()

  jobs:

  - job: Deploy
    displayName: Kubernetes Deployment

    steps:

    - download: current
      artifact: manifests

    - template: templates/deploy-aks.yml

      parameters:
        azureSubscription: 'devops-spn'
        resourceGroup: 'prod-aks-rg'
        aksCluster: 'prod-aks'