trigger:
  branches:
    include:
      - main

pool:
  name: Enterprise-AKS-Agents

variables:
- group: Enterprise-AKS-Variables

stages:

- stage: Build
  displayName: Build Docker Image

  jobs:
  - job: DockerBuild
    displayName: Build & Push Image

    steps:

    - checkout: self

    - template: templates/docker-build-image.yml

      parameters:
        acrServiceConnection: 'ACR-ServiceConnection'
        imageRepository: 'enterprise-flask'
        dockerfile: 'application/Dockerfile'
        buildContext: 'application'

    - task: CopyFiles@2
      displayName: Copy Kubernetes Manifests

      inputs:
        SourceFolder: application/k8s
        Contents: '**'
        TargetFolder: $(Build.ArtifactStagingDirectory)

    - task: PublishBuildArtifacts@1
      displayName: Publish K8s Manifests

      inputs:
        PathtoPublish: $(Build.ArtifactStagingDirectory)
        ArtifactName: manifests

- stage: ProductionApproval 
  displayName: Production Environment Approval 
  dependsOn: Build 
  condition: succeeded() 
  
  jobs: 
  
  - job: Approval 
    displayName: Waiting for Production Approval 
    pool: server 
    
    steps: 
    
    - task: ManualValidation@1 
      
      displayName: Approve Production Deployment 
      
      inputs: 
        notifyUsers: | 
          debabrata.pain@cloud4c.com 
          
        approvers: | 
          debabrata.pain@cloud4c.com 
          
        instructions: | 
          Please review and approve the production deployment. 
          
          Build: $(Build.BuildNumber) 
          Branch: $(Build.SourceBranch) 
          
          Approve this validation to continue with deployment to AKS. 
          
        onTimeout: reject 
        
        timeoutInMinutes: 1440

- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: ProductionApproval
  condition: succeeded()
    
  jobs:

  - job: Deploy

    displayName: Kubernetes Deployment 
        
    steps: 
          
      - download: current 
            
        artifact: manifests 
            
      - template: templates/deploy-aks.yml 
            
        parameters: 
            
          azureSubscription: 'devops-spn' 
          resourceGroup: 'prod-aks-rg' 
          aksCluster: 'prod-aks'